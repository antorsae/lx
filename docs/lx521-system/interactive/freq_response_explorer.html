<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frequency Response Explorer</title>
    <script src="https://cdn.plot.ly/plotly-3.3.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; }
        .container {
            display: flex;
            height: 100vh;
        }
        .sidebar {
            width: 320px;
            background: white;
            padding: 20px;
            overflow-y: auto;
            border-right: 1px solid #ddd;
            flex-shrink: 0;
        }
        .plot-area {
            flex: 1;
            padding: 10px;
        }
        #plot {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #333;
            border-bottom: 2px solid #2563eb;
            padding-bottom: 8px;
        }
        h3 {
            font-size: 0.9rem;
            margin: 15px 0 10px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .driver-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .extra-driver-controls {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin: 6px 0 12px;
        }
        .extra-driver-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .extra-driver-controls button {
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .extra-driver-controls button:hover {
            background: #eef2ff;
        }
        .extra-driver-controls button:disabled {
            cursor: default;
            opacity: 0.6;
        }
        .info-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 1px solid #cbd5e1;
            color: #64748b;
            font-size: 0.7rem;
            cursor: help;
            background: #fff;
        }
        .extra-driver-note {
            font-size: 0.75rem;
            color: #666;
        }
        .driver-item {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .driver-item:hover {
            border-color: #2563eb;
            background: #f8fafc;
        }
        .driver-item.active {
            border-color: var(--driver-color);
            background: color-mix(in srgb, var(--driver-color) 10%, white);
        }
        .driver-header {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        .driver-checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--driver-color);
        }
        .driver-line {
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: -2px;
            color: var(--driver-color);
        }
        .driver-name {
            flex: 1;
            font-weight: 500;
        }
        .offset-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #eee;
            font-size: 0.85rem;
            color: #666;
        }
        .offset-control input[type="range"] {
            flex: 1;
            min-width: 80px;
        }
        .offset-control input[type="number"] {
            width: 55px;
            padding: 3px 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }
        .delay-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #666;
        }
        .delay-control input[type="number"] {
            width: 70px;
            padding: 3px 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }
        .invert-control {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 0.85rem;
            color: #666;
        }
        .invert-control label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .invert-control input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--driver-color);
        }
        .angle-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
        }
        .angle-btn {
            padding: 8px 4px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .angle-btn:hover {
            border-color: #2563eb;
        }
        .angle-btn.active {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .quick-select {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .quick-btn {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .quick-btn:hover {
            background: #f0f0f0;
        }
        /* Display options styles */
        .display-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }
        .option-radio-row {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 0.9rem;
            color: #444;
        }
        .option-radio-row .option-label {
            font-weight: 600;
            color: #444;
        }
        .option-radio {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .option-radio input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        .option-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: #444;
        }
        .option-checkbox input {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }
        /* Filter section styles */
        .filter-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }
        .filter-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }
        .timing-controls {
            margin-bottom: 15px;
        }
        .io-label {
            min-width: 44px;
            font-size: 0.8rem;
            color: #666;
            font-weight: 600;
            letter-spacing: 0.3px;
        }
        .filter-controls button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .filter-controls button:hover {
            background: #f0f0f0;
        }
        .filter-controls button.primary {
            background: #2563eb;
            color: white;
            border-color: #2563eb;
        }
        .filter-controls button.primary:hover {
            background: #1d4ed8;
        }
        .filter-controls button.danger {
            background: #fee2e2;
            color: #dc2626;
            border-color: #fecaca;
        }
        .filter-controls button.danger:hover {
            background: #fecaca;
        }
        .filter-driver-select {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }
        .filter-driver-select select {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }
        .filter-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        .filter-card {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #fafafa;
        }
        .filter-card.disabled {
            opacity: 0.5;
        }
        .filter-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .filter-card-header input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        .filter-card-header select {
            flex: 1;
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.85rem;
        }
        .filter-card-header .delete-btn {
            padding: 2px 8px;
            border: none;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .filter-card-header .delete-btn:hover {
            background: #fecaca;
        }
        .filter-param {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 0.8rem;
        }
        .filter-param label {
            width: 45px;
            color: #666;
        }
        .filter-param input[type="range"] {
            flex: 1;
        }
        .filter-param input[type="number"] {
            width: 70px;
            padding: 3px 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: right;
        }
        .filter-param span {
            width: 25px;
            color: #888;
        }
        .no-filters {
            color: #888;
            font-size: 0.85rem;
            font-style: italic;
            padding: 10px;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
        .optimize-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }
        .optimize-section h4 {
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: #444;
        }
        .optimize-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .opt-param {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .opt-param label {
            min-width: 90px;
            color: #666;
        }
        .opt-param input[type="number"] {
            width: 70px;
            padding: 4px 6px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: right;
        }
        .opt-param select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .opt-buttons {
            display: flex;
            gap: 8px;
            margin-top: 5px;
        }
        .opt-buttons button {
            flex: 1;
        }
        .opt-status {
            font-size: 0.8rem;
            color: #666;
            padding: 5px 0;
            font-style: italic;
        }
        .opt-checkbox {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 0.7rem;
            color: #666;
        }
        .opt-checkbox input {
            width: 14px;
            height: 14px;
        }
        /* Visual Crossover Overlay styles */
        .crossover-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid #e0e0e0;
        }
        .crossover-controls {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .crossover-controls button {
            padding: 6px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .crossover-controls button:hover {
            background: #f0f0f0;
        }
        .crossover-controls button.primary {
            background: #10b981;
            color: white;
            border-color: #10b981;
        }
        .crossover-controls button.primary:hover {
            background: #059669;
        }
        .crossover-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .crossover-card {
            padding: 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background: #f0fdf4;
        }
        .crossover-card.disabled {
            opacity: 0.5;
            background: #fafafa;
        }
        .crossover-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .crossover-card-header input[type="checkbox"] {
            width: 16px;
            height: 16px;
        }
        .crossover-card-header select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.85rem;
            background: white;
        }
        .crossover-card-header .delete-btn {
            padding: 2px 8px;
            border: none;
            background: #fee2e2;
            color: #dc2626;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-left: auto;
        }
        .crossover-card-header .delete-btn:hover {
            background: #fecaca;
        }
        .crossover-param {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
            font-size: 0.8rem;
        }
        .crossover-param label {
            width: 45px;
            color: #666;
        }
        .crossover-param input[type="range"] {
            flex: 1;
        }
        .crossover-param input[type="number"] {
            width: 70px;
            padding: 3px 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: right;
        }
        .crossover-param span {
            width: 25px;
            color: #888;
        }
        .crossover-drivers {
            display: flex;
            gap: 12px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed #d1d5db;
        }
        .crossover-driver-select {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
        }
        .crossover-driver-select label {
            color: #666;
            font-weight: 500;
        }
        .crossover-driver-select select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.8rem;
            background: white;
        }
        .no-crossovers {
            color: #888;
            font-size: 0.85rem;
            font-style: italic;
            padding: 10px;
            text-align: center;
        }
        .apply-checkbox {
            display: flex;
            align-items: center;
            gap: 2px;
            font-size: 0.7rem;
            color: #666;
            cursor: pointer;
        }
        .apply-checkbox input {
            width: 14px;
            height: 14px;
        }
        /* X-O derived filter styles */
        .filter-card.from-crossover {
            background: #f0f9ff;
            border-color: #7dd3fc;
        }
        .filter-card.from-crossover.disabled {
            background: #f8fafc;
            border-color: #e2e8f0;
        }
        .xo-badge {
            background: #0ea5e9;
            color: white;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .filter-card.disabled .xo-badge {
            background: #94a3b8;
        }
        .xo-filter-type {
            font-weight: 500;
            font-size: 0.85rem;
            color: #334155;
        }
        .xo-filter-status {
            margin-left: auto;
            font-size: 1rem;
            color: #22c55e;
        }
        .filter-card.disabled .xo-filter-status {
            color: #cbd5e1;
        }
        .filter-param.readonly {
            padding: 4px 0;
        }
        .readonly-value {
            font-family: monospace;
            font-size: 0.85rem;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>Frequency Response Explorer</h2>

		            <h3>Drivers (click to toggle)</h3>
		            <div class="driver-list" id="driverList"></div>
                    
                <div class="extra-driver-controls">
                    <div class="extra-driver-row">
                        <button id="loadExtraJuanBtn" onclick="loadExtraDrivers('juan-baffleless')">Load Juan baffleless drivers</button>
                        <span class="info-icon" title="No interpolation needed.">(i)</span>
                    </div>
                    <div class="extra-driver-note">Adds: GRS PT6816, SS10F8414G10</div>
                </div>
            
                <div class="filter-controls timing-controls">
                    <button onclick="resetTimingAdjustments()" title="Clear per-driver delay and invert adjustments">Clear Delay/Invert</button>
                </div>
	
	            <h3>Angles</h3>
	            <div class="quick-select">
	                <button class="quick-btn" onclick="selectAngles([0])">0° only</button>
	                <button class="quick-btn" onclick="selectAngles([0,30,60,90])">0/30/60/90</button>
                <button class="quick-btn" onclick="selectAllAngles()">All</button>
                <button class="quick-btn" onclick="selectAngles([])">None</button>
            </div>
            <div class="angle-grid" id="angleGrid"></div>

	            <h3>Display Options</h3>
	            <div class="display-options">
	                <label class="option-checkbox">
	                    <input type="checkbox" id="showPhase" onchange="updatePlot()">
	                    Show Phase Response
	                </label>
                    <div class="option-radio-row">
                        <span class="option-label">SUM:</span>
                        <label class="option-radio" title="Hide SUM trace">
                            <input type="radio" name="sumMode" value="off" checked onchange="updatePlot()">
                            Off
                        </label>
                        <label class="option-radio" title="Show SUM along with individual drivers">
                            <input type="radio" name="sumMode" value="overlay" onchange="updatePlot()">
                            SUM + Drivers
                        </label>
                        <label class="option-radio" title="Show SUM only (hide individual drivers)">
                            <input type="radio" name="sumMode" value="only" onchange="updatePlot()">
                            SUM Only
                        </label>
                    </div>
	            </div>

	            <div class="filter-section">
	                <h3>Filters (IIR EQ)</h3>
	                <div class="filter-controls">
	                    <button class="primary" onclick="addFilter()">+ Add Filter</button>
                        <button class="danger" onclick="clearAllUserFilters()" title="Clear all user EQ filters (keeps crossovers)">Clear Filters</button>
	                </div>
                    <div class="filter-controls">
                        <span class="io-label">YAML:</span>
	                    <button onclick="document.getElementById('yamlInput').click()">Load</button>
	                    <button onclick="saveFiltersYaml()">Save</button>
                    </div>
                    <div class="filter-controls">
                        <span class="io-label">DSP:</span>
	                    <button onclick="document.getElementById('dspInput').click()" title="Load filters from miniDSP .dsp file">Load</button>
                        <button onclick="saveDspFile()" title="Export current filters/gain/delay/invert to miniDSP .dsp">Save</button>
                    </div>
	                <input type="file" id="yamlInput" accept=".yaml,.yml" onchange="loadYamlFile(event)" style="display:none">
	                <input type="file" id="dspInput" accept=".dsp" onchange="handleDspFileLoad(event)" style="display:none">
	                <div class="filter-driver-select">
	                    <label>Driver:</label>
	                    <select id="filterDriverSelect" onchange="selectFilterDriver(this.value)"></select>
	                </div>
                <div class="filter-list" id="filterList">
                    <div class="no-filters">No filters defined</div>
                </div>

                <div class="optimize-section">
                    <h4>Auto-Optimize</h4>
                    <div class="optimize-controls">
                        <div class="opt-param">
                            <label>Target Range:</label>
                            <input type="number" id="optFreqMin" value="200" min="20" max="20000" onchange="saveUiStateToLocalStorage()"> Hz to
                            <input type="number" id="optFreqMax" value="10000" min="20" max="20000" onchange="saveUiStateToLocalStorage()"> Hz
                        </div>
                        <div class="opt-param">
                            <label>Reference Angle:</label>
                            <select id="optRefAngle" onchange="saveUiStateToLocalStorage()"></select>
                        </div>
                        <div class="opt-buttons">
                            <button id="optimizeBtn" class="primary" onclick="runOptimization()">Optimize Selected</button>
                            <button id="undoOptBtn" onclick="undoOptimization()" style="display:none;">Undo</button>
                        </div>
                        <div id="optStatus" class="opt-status">Ready</div>
                    </div>
                </div>
            </div>

            <div class="crossover-section">
                <h3>Visual Crossover Overlay</h3>
                <div class="crossover-controls">
                    <button class="primary" onclick="addCrossover()">+ Add X-O</button>
                </div>
                <div class="crossover-list" id="crossoverList">
                    <div class="no-crossovers">No crossovers defined</div>
                </div>
            </div>
        </div>
        <div class="plot-area">
            <div id="plot"></div>
        </div>
    </div>
