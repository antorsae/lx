	var freqValues = [120.1,121.9,124.5,126.3,128.2,131.0,132.9,135.8,137.8,139.8,142.8,144.9,147.0,150.2,152.4,155.8,158.0,160.3,163.8,166.2,168.6,172.3,174.8,177.4,181.3,183.9,187.9,190.7,193.4,197.7,200.6,203.5,207.9,211.0,215.6,218.7,221.9,226.8,230.0,233.4,238.5,242.0,245.5,250.9,254.5,260.1,263.9,267.7,273.6,277.6,281.6,287.8,291.9,296.2,302.7,307.1,313.8,318.4,323.0,330.1,334.9,339.7,347.2,352.2,359.9,365.2,370.5,378.6,384.1,389.7,398.2,404.0,409.9,418.9,425.0,434.3,440.6,447.0,456.8,463.4,470.2,480.5,487.5,498.1,505.4,512.7,524.0,531.6,539.3,551.1,559.1,567.3,579.7,588.1,601.0,609.7,618.6,632.2,641.3,650.7,664.9,674.6,689.4,699.4,709.6,725.1,735.7,746.4,762.7,773.8,785.0,802.2,813.9,831.7,843.8,856.1,874.8,887.6,900.5,920.2,933.6,954.0,967.9,982.0,1003.5,1018.1,1032.9,1055.5,1070.9,1086.4,1110.2,1126.4,1151.0,1167.8,1184.8,1210.7,1228.3,1246.2,1273.5,1292.0,1320.3,1339.5,1359.0,1388.7,1408.9,1429.4,1460.7,1482.0,1503.5,1536.4,1558.8,1592.9,1616.1,1639.6,1675.5,1699.9,1724.6,1762.4,1788.0,1814.0,1853.7,1880.7,1921.9,1949.8,1978.2,2021.5,2050.9,2080.7,2126.3,2157.2,2204.5,2236.5,2269.1,2318.8,2352.5,2386.7,2439.0,2474.4,2510.4,2565.4,2602.7,2659.7,2698.4,2737.6,2797.6,2838.3,2879.6,2942.6,2985.4,3050.8,3095.2,3140.2,3208.9,3255.6,3303.0,3375.3,3424.4,3474.2,3550.3,3601.9,3680.8,3734.3,3788.6,3871.6,3927.9,3985.1,4072.3,4131.5,4222.0,4283.4,4345.7,4440.9,4505.5,4571.0,4671.1,4739.0,4808.0,4913.3,4984.7,5093.9,5168.0,5243.1,5358.0,5435.9,5515.0,5635.7,5717.7,5842.9,5927.9,6014.1,6145.8,6235.2,6325.9,6464.4,6558.4,6653.8,6799.5,6898.4,7049.5,7152.0,7256.0,7414.9,7522.8,7632.2,7799.3,7912.8,8086.0,8203.6,8323.0,8505.2,8628.9,8754.4,8946.1,9076.3,9208.3,9409.9,9546.8,9755.8,9897.7,10041.7,10261.6,10410.8,10562.3,10793.6,10950.5,11109.8,11353.1,11518.2,11770.5,11941.7,12115.4,12380.6,12560.7,12743.4,13022.5,13211.9,13501.2,13697.6,13896.8,14201.1,14407.7,14617.2,14937.3,15154.6,15375.0,15711.7,15940.2,16289.2,16526.2,16766.6,17133.7,17382.9,17635.8,18021.9,18284.1,18684.4,18956.2,19231.9,19653.0,19938.9];

function getClosestFreqIndex(targetFreq) {
    // Find closest frequency index
    var closestIdx = 0;
    var minDiff = Math.abs(freqValues[0] - targetFreq);
    for (var i = 1; i < freqValues.length; i++) {
        var diff = Math.abs(freqValues[i] - targetFreq);
        if (diff < minDiff) {
            minDiff = diff;
            closestIdx = i;
        }
    }
    return closestIdx;
}

function findSliderElement(plotDiv) {
    return (
        plotDiv.querySelector('.slider-container') ||
        plotDiv.querySelector('.slider-group') ||
        plotDiv.querySelector('.slider') ||
        plotDiv.querySelector('.sliders')
    );
}

function positionFrequencyInput() {
    const plotDiv = document.querySelector('.plotly-graph-div');
    const container = document.querySelector('.freq-input-container');
    if (!plotDiv || !container) {
        return;
    }

    if (!plotDiv.contains(container)) {
        plotDiv.appendChild(container);
    }
    if (!plotDiv.style.position) {
        plotDiv.style.position = 'relative';
    }

    const plotRect = plotDiv.getBoundingClientRect();
    const sliderEl = findSliderElement(plotDiv);
    if (sliderEl) {
        const sliderRect = sliderEl.getBoundingClientRect();
        const containerRect = container.getBoundingClientRect();
        const top = Math.max(0, sliderRect.top - plotRect.top - containerRect.height - 6);
        container.style.top = `${top}px`;
        container.style.bottom = 'auto';
        return;
    }

    const layout = plotDiv._fullLayout;
    const size = layout?._size;
    const slider = layout?.sliders?.[0];
    if (size && slider) {
        const padB = slider.pad?.b ?? 0;
        const sliderTop = size.t + size.h + padB;
        const containerRect = container.getBoundingClientRect();
        const top = Math.max(0, sliderTop - containerRect.height - 6);
        container.style.top = `${top}px`;
        container.style.bottom = 'auto';
    }
}

function setFrequencyFromInput() {
    var inputEl = document.getElementById('freqInput');
    if (!inputEl) {
        return;
    }
    var targetFreq = parseFloat(inputEl.value);
    if (isNaN(targetFreq)) {
        return;
    }
    if (targetFreq < 120.1171875) {
        targetFreq = 120.1171875;
    } else if (targetFreq > 19938.9081528) {
        targetFreq = 19938.9081528;
    }

    var closestIdx = getClosestFreqIndex(targetFreq);
    // Update slider
    var plotDiv = document.querySelector('.plotly-graph-div');
    if (plotDiv) {
        Plotly.relayout(plotDiv, {'sliders[0].active': closestIdx});
        // Also trigger the restyle to update the plot
        var slider = plotDiv.layout.sliders[0];
        if (slider && slider.steps && slider.steps[closestIdx]) {
            var step = slider.steps[closestIdx];
            var traceIndices = (step.args && step.args[1]) ? step.args[1] : baseTraceIndices;
            Plotly.restyle(plotDiv, step.args[0], traceIndices);
            if (plotDiv._extraPolarDatasets) {
                loadedExtraPolarEntries(plotDiv).forEach(function(loaded) {
                    var sourceStep = loaded.stepData[Math.max(0, Math.min(closestIdx, loaded.stepData.length - 1))] || [];
                    var extraStep = loaded.sourceIndexes.map(function(sourceIdx) {
                        return sourceStep[sourceIdx];
                    }).filter(Boolean);
                    Plotly.restyle(plotDiv, {
                        r: extraStep.map(d => d.r),
                        theta: extraStep.map(d => d.theta),
                        'line.color': polarStepColors(loaded.drivers || [], extraStep),
                        opacity: polarStepOpacity(extraStep)
                    }, loaded.traceIndices);
                });
            }
        }
    }

    inputEl.value = Math.round(freqValues[closestIdx]);
}

function syncInputToSlider(idx) {
    var inputEl = document.getElementById('freqInput');
    if (!inputEl) {
        return;
    }
    inputEl.value = Math.round(freqValues[idx] || freqValues[0]);
}

function schedulePlotResize() {
    var plotDiv = document.querySelector('.plotly-graph-div');
    if (!plotDiv || !window.Plotly || !Plotly.Plots || !Plotly.Plots.resize) {
        return;
    }
    Plotly.Plots.resize(plotDiv);
    setTimeout(function() { Plotly.Plots.resize(plotDiv); }, 150);
}

function initFrequencyInput() {
    var inputEl = document.getElementById('freqInput');
    if (!inputEl) {
        return;
    }
    syncInputToSlider(0);
    positionFrequencyInput();
    inputEl.addEventListener('change', setFrequencyFromInput);
    inputEl.addEventListener('blur', setFrequencyFromInput);
    inputEl.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            setFrequencyFromInput();
        }
    });

    function hookSliderChanges(attempt) {
        var plotDiv = document.querySelector('.plotly-graph-div');
        if (!plotDiv || !plotDiv.on) {
            if (attempt < 20) {
                setTimeout(function() { hookSliderChanges(attempt + 1); }, 200);
            }
            return;
        }
        if (plotDiv._freqInputHook) {
            return;
        }
        plotDiv._freqInputHook = true;
        plotDiv.on('plotly_sliderchange', function(e) {
            var idx = (e && e.slider && e.slider.active);
            if (idx == null) {
                idx = (e && e.stepIndex) || 0;
            }
            syncInputToSlider(idx);
        });
        plotDiv.on('plotly_afterplot', positionFrequencyInput);
        plotDiv.on('plotly_relayout', positionFrequencyInput);
    }

    hookSliderChanges(0);
    schedulePlotResize();
    window.addEventListener('resize', function() {
        setTimeout(positionFrequencyInput, 100);
    });
}

initFrequencyInput();
    
	</script>
