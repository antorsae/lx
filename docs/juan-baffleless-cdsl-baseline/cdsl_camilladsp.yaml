# Preliminary CamillaDSP-style filter export
# Topology: cascaded mixed-order LR split tree; later drivers include upstream high-pass stages in this per-channel export.
# LR2 splits invert the next/downstream branch; polarity is exported per driver.
# Diagram:
# Input
#   +-- LR4 HP 70 Hz (2 biquads, global boundary)
#     +-- LR4 split @ 200 Hz
#         +-- LR4 LP 200 Hz (2 biquads) -> L26RO4Y
#         +-- LR4 HP 200 Hz (2 biquads) -> next split
#       +-- LR4 split @ 800 Hz
#           +-- LR4 LP 800 Hz (2 biquads) -> L22MG (nude)
#           +-- LR4 HP 800 Hz (2 biquads) -> next split
#         +-- LR4 split @ 2500 Hz
#             +-- LR4 LP 2500 Hz (2 biquads) -> GRS PT6816
#             +-- LR4 HP 2500 Hz (2 biquads) -> ND25FW4 (nude 18mm)
filters:
  L26RO4Y_1:
    type: Biquad
    parameters: {type: highpass, freq: 70.000, q: 0.7071, gain: 0.000}
  L26RO4Y_2:
    type: Biquad
    parameters: {type: highpass, freq: 70.000, q: 0.7071, gain: 0.000}
  L26RO4Y_3:
    type: Biquad
    parameters: {type: lowpass, freq: 200.000, q: 0.7071, gain: 0.000}
  L26RO4Y_4:
    type: Biquad
    parameters: {type: lowpass, freq: 200.000, q: 0.7071, gain: 0.000}
  L26RO4Y_5:
    type: Biquad
    parameters: {type: peaking, freq: 110.000, q: 1.0000, gain: -1.200}
  L26RO4Y_6:
    type: Biquad
    parameters: {type: lowshelf, freq: 95.000, q: 1.0000, gain: -0.534}
